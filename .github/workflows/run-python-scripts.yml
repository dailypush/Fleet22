name: Run Python Scripts and Update JSON Data

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: scripts/requirements-scraping.lock
      - run: pip install -r scripts/requirements-scraping.lock
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_sail_declaration.cjs
      - run: python -m scripts.validators.validate_fleet_data
      - run: python -m scripts.generate_site --check
      - run: python -m scripts.validators.check_site

  update-data:
    # PRs run offline regression checks; only main can refresh and publish data.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: scripts/requirements-scraping.lock
      - run: pip install -r scripts/requirements-scraping.lock
      - name: Refresh, validate, and generate data
        run: python -m scripts.update_all_data
      - name: Commit validated snapshots
        run: |
          git add data/boats/boats_fleet22.json data/members/j105_members_status.json data/sails/sail_tags.json data/combined/combined_fleet_data.json data/combined/fleet_statistics.json data/metadata.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git commit -m "Refresh validated fleet data"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scraper-results
          path: |
            logs/*.log
            data/metadata.json
            data/combined/*.json
          retention-days: 14
